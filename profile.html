<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <header class="sticky_header">
        <h1>My Profile</h1>
    </header>

    <section class="profile-card"> 

        <div class="badge">⭐</div>
        <img src="myimg.jpeg" alt="profile picture" class="profile-picture">
        <h2 class="name">Aliyan Amjad</h2>
        <p class="bio">Front End Developer with zero experience building user friendly tools, also experience in backend, AI Tools </p>
        <div class="stats">
        <div class="stat">
            <h3>8+</h3>
            <p>Projects</p>
        </div>

        <div class="stat"> 
            <h3>Fresher</h3>
            <p>Client</p>
        </div>
        </div></div>
        
    </section>
    <button class="contant-button">📞Contact Me</button>
</body>
</html>
